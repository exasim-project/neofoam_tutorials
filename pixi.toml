[workspace]
authors = ["Henning Scheufler <henning.scheufler@web.de>"]
channels = ["conda-forge"]
name = "neofoam_verification"
platforms = ["linux-64"]
version = "0.1.0"

[activation.env]
# The external reference: TwoPhaseFlow's advectorVoF (MULESScheme) and its
# volumeFractionError function object, built for OpenFOAM-v2506 under
# ~/OpenFOAM/<user>-v2506 (TwoPhaseFlow_latest). OpenFOAM-v2406 has no
# TwoPhaseFlow build, so the C++ reference runs on v2506.
TWOPHASEFLOW_BASHRC = "$HOME/OpenFOAM/OpenFOAM-v2506/etc/bashrc"

[dependencies]
python = "3.12.*"
pip = "*"
setuptools = ">=64"
numpy = "*"
foamlib = "*"
pytest = "*"

# Lint and type-check tools (as neofoam_mechanics).
[feature.dev.dependencies]
ruff = "0.14.2.*"
mypy = "*"
pre-commit = "*"

[environments]
default = ["dev"]

[tasks]
install = 'pip install -e . --no-build-isolation --no-deps'
# The tests marked openfoam run TwoPhaseFlow's advectorVoF and skip without it.
test = { cmd = "pytest -v", depends-on = ["install"] }
# Re-runs the C++ MULES reference of every benchmark and rewrites reference/<case>/.
update-reference = { cmd = "python -m neofoam_verification.reference", depends-on = ["install"] }
# Re-runs the OpenFOAM-v2406 reconstruction reference (reference/reconstructionReference)
# of every curvature case and rewrites reference/curvature*/.
update-reconstruction-reference = { cmd = "python -m neofoam_verification.reconstruction", depends-on = ["install"] }
# Re-runs the OpenFOAM-v2406 isoAdvection face-flux reference (reference/advectionFluxReference)
# of every curvature case and rewrites reference/curvature*/advection/.
update-advection-flux-reference = { cmd = "python -m neofoam_verification.advection_flux", depends-on = ["install"] }
# Re-runs the OpenFOAM-v2406 multi-step isoAdvection reference (reference/isoAdvectionReference)
# and rewrites reference/<case>/isoAdvection/ (curvature2D and the TwoPhaseFlow benchmarks).
update-isoadvection-reference = { cmd = "python -m neofoam_verification.isoadvection", depends-on = ["install"] }
# Re-runs TwoPhaseFlow's advectorVoF with its isoAdvection on the benchmarks (v2506, benchmark
# context next to MULES) and rewrites reference/<case>/<resolution>/twoPhaseFlowIsoAdvection/.
update-twophaseflow-isoadvection-reference = { cmd = "python -m neofoam_verification.isoadvection --twophaseflow", depends-on = ["install"] }
lint = "ruff check src tests && ruff format --check src tests"
format = "ruff format src tests && ruff check --fix src tests"
type-check = "mypy"
