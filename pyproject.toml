[project]
name = "neofoam-verification"
version = "0.1.0"
description = "Verification of NeoFOAM's MULES VoF advection against OpenFOAM (TwoPhaseFlow benchmarks)"
authors = [{ name = "Henning Scheufler", email = "henning.scheufler@web.de" }]
requires-python = ">=3.10"
# numpy, foamlib, PyYAML and snakemake come from the pixi environment; neofoam is built
# into it from a checkout by `pixi run install-neofoam` (the pip installs use --no-deps).
dependencies = ["neofoam"]

# The NeoFOAM benchmark solvers: `neofoam solver <name>`.
[project.entry-points."neofoam.solvers"]
reconstructInterface = "neofoam_verification.solvers.reconstruct_interface"
advectorVoF = "neofoam_verification.solvers.advector_vof"
incompressibleVoFNeoNSweep = "neofoam_verification.solvers.vof_neon"

# NeoFOAM members the benchmarks use: the setAlphaPlane preprocess tool.
[project.entry-points."neofoam.plugins"]
setAlphaPlane = "neofoam_verification.tools.set_alpha_plane"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "openfoam: needs OpenFOAM-v2506 with TwoPhaseFlow's advectorVoF / reconstructInterface (TWOPHASEFLOW_BASHRC)",
    "geometricvof: builds and runs reference/reconstructionReference and advectionFluxReference (OpenFOAM-v2406, OPENFOAM_BASHRC)",
    "backend: needs NeoFOAM (the MULES advection library, or installed into this env for the benchmark solvers)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".pixi/", "cases/", "results/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["neofoam_verification"]

[tool.mypy]
files = ["src"]
mypy_path = ["src"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["foamlib", "foamlib.*", "pandas", "pandas.*", "yaml", "neofoam", "neofoam.*", "pybFoam", "pybFoam.*"]
ignore_missing_imports = true
