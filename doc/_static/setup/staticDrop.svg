   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(351 56.635312)">domain 8 × 8 mm</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(351 71.035313)">R = 2 mm at the centre</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(351 84.558516)">σ = 0.07 N/m, g = (0 0 0)</text>
