   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(351 127.763438)">σ/R = 35 Pa (Laplace jump)</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(351 142.163437)">dt = 2e-05 s fixed, 200 steps</text>
